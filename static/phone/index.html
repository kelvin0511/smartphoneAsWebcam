<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PhoneCam — Mobile Camera</title>
  <link rel="stylesheet" href="/static/phone/styles.css" />
</head>
<body>
  <!-- PIN Entry Screen (shown only if no ?token= in URL) -->
  <div id="pin-screen" class="screen hidden">
    <div class="pin-card">
      <div class="pin-header">
        <h1>PhoneCam</h1>
        <button id="pin-lang-btn" class="hud-lang-btn" type="button">繁中</button>
      </div>
      <p data-i18n="pinPrompt">Enter the 6-digit pairing PIN shown on your PC dashboard.</p>
      <input id="pin-input" type="tel" inputmode="numeric" maxlength="6" placeholder="000000" />
      <button id="pin-submit-btn" class="primary-btn" data-i18n="connectBtn">Connect</button>
      <p id="pin-error" class="error-text hidden"></p>
    </div>
  </div>

  <!-- Main Camera Screen -->
  <div id="camera-screen" class="camera-shell hidden">
    <div class="video-stage" id="video-stage">
      <video id="preview" autoplay playsinline muted></video>
      <div id="focus-ring" class="focus-ring hidden"></div>
      <div id="paused-overlay" class="paused-overlay hidden">
        <div class="paused-badge" data-i18n="pausedBadge">Camera Paused (Privacy Mode)</div>
      </div>

      <!-- Top HUD -->
      <div class="top-hud">
        <div id="status-badge" class="status-badge">Connecting...</div>
        <div class="hud-right">
          <div id="stats-hud" class="stats-hud">— fps • — kbps</div>
          <button id="cam-lang-btn" class="hud-lang-btn" type="button">繁中</button>
        </div>
      </div>

      <!-- Toast message -->
      <div id="toast" class="toast hidden"></div>
    </div>

    <!-- Bottom Controls -->
    <div class="controls-bar">
      <div class="control-row">
        <select id="quality-select" aria-label="Resolution and FPS">
          <option value="1280x720x30" selected>720p • 30fps</option>
          <option value="1280x720x60">720p • 60fps</option>
          <option value="1920x1080x30">1080p • 30fps</option>
          <option value="1920x1080x60">1080p • 60fps</option>
        </select>
        <button id="flip-cam-btn" class="ctrl-btn" data-i18n="flipCam">Flip Cam</button>
        <button id="rotate-btn" class="ctrl-btn">Rotate 0°</button>
      </div>

      <div class="control-row">
        <button id="mirror-btn" class="ctrl-btn">Mirror: Off</button>
        <button id="pause-btn" class="ctrl-btn" data-i18n="pause">Pause</button>
        <button id="dim-btn" class="ctrl-btn" data-i18n="dimScreen">Dim Screen</button>
      </div>
    </div>
  </div>

  <!-- Battery-Saver Dim Overlay -->
  <div id="dim-overlay" class="dim-overlay hidden">
    <div class="dim-info">
      <span class="dim-dot"></span>
      <span data-i18n="dimStreaming">Streaming in Battery-Saver Mode</span>
      <small data-i18n="dimWake">Tap anywhere to wake screen</small>
    </div>
  </div>

  <script src="/static/phone/app.js"></script>
</body>
</html>
